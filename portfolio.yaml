  # ---- i18n editorial sections ----
  # Two visitor-facing prose sections render above the question board:
  #   1) economic_war_frame — the editorial framing (why the page exists)
  #   2) base_case — the modal forecast (what's most likely)
  # Both have `en` + `fa` variants. `base_case` additionally has a `public`
  # field per language for the stripped public deploy (drops family-business
  # specifics). Renderer falls back to English on missing Persian.

  economic_war_frame:
    en:
      title: "The frame: a negotiated off-ramp — political deal first, physical and nuclear normalization later"
      body: |
        After 100-plus days, the 2026 Iran-US war is ending by deal, not by exhaustion. On June 14 Trump declared a framework "complete"; Iran's Deputy FM Gharibabadi confirmed it, with a formal signing set for June 19 in Switzerland. The agreement immediately halts the fighting "on all fronts, including Lebanon," lifts the US naval blockade, and reopens the Strait of Hormuz toll-free — with a 60-day window to negotiate a permanent settlement. The economic-war frame that defined the spring (Iran's Hormuz closure versus Washington's blockade and sanctions) didn't end in a knockout; it ended at the table.

        But "deal" is doing a lot of work. Three clocks now run at different speeds. The political deal is fastest — signing, blockade-lift, a declared ceasefire. Physical normalization is slower: Hormuz transit was still a trickle (~2-6 ships/day versus ~135 pre-war) in mid-June, and mine-clearing could take up to six months, so the shipping recovery lags the announcement. Slowest is the nuclear-and-sanctions file: enrichment, Iran's ~440kg 60%-enriched stockpile, sanctions relief, and a disputed $24B in frozen assets were all deferred to the 60-day talks — and the US zero-enrichment demand is exactly the rock the spring's diplomacy kept hitting.

        So the live risk is no longer "does the economic war escalate to a shooting war" — that already happened and then stopped. It is "does the framework convert into a durable settlement, or relapse." The war's hardest fact is now fixed: Ali Khamenei was killed on Feb 28 and his son Mojtaba runs Iran as an invisible, contested Supreme Leader. The questions below are re-sorted around the new phase: what has resolved, what the 60-day window decides, and where the off-ramp could still break.
      map_to_questions: |
        The diplomatic cards (A) now measure whether the framework hardens into a permanent deal. The military cards (B) are mostly resolved — they record what the war already did — with B6 tracking whether the ceasefire holds. The economic cards (D) unwound their war premium. The regime cards (C) recorded a forced succession. The US-side cards (E) measure Trump's standing into the midterms.
    fa:
      title: "چارچوب: یک خروج مذاکره‌شده — اول توافق سیاسی، سپس عادی‌سازی فیزیکی و هسته‌ای"
      body: |
        پس از بیش از صد روز، جنگ ۲۰۲۶ ایران و آمریکا با توافق پایان می‌یابد، نه با فرسایش. در ۱۴ ژوئن ترامپ یک چارچوب را «کامل» اعلام کرد؛ قریب‌آبادی معاون وزیر خارجه‌ی ایران آن را تأیید کرد و امضای رسمی برای ۱۹ ژوئن در سوئیس تعیین شد. توافق بی‌درنگ جنگ را «در همه‌ی جبهه‌ها از جمله لبنان» متوقف می‌کند، محاصره‌ی دریایی آمریکا را برمی‌دارد، و تنگه‌ی هرمز را بدون عوارض بازمی‌گشاید — با پنجره‌ی ۶۰ روزه برای مذاکره‌ی یک تسویه‌ی دائمی. چارچوب جنگ اقتصادیِ بهار با ضربه‌ی فنی پایان نیافت؛ سرِ میز پایان یافت.

        اما «توافق» بار زیادی بر دوش دارد. اکنون سه ساعت با سرعت‌های متفاوت کار می‌کنند. توافق سیاسی سریع‌ترین است — امضا، رفع محاصره، آتش‌بس اعلام‌شده. عادی‌سازی فیزیکی کندتر است: تردد هرمز در میانه‌ی ژوئن هنوز ناچیز بود (حدود ۲ تا ۶ کشتی در روز در برابر ۱۳۵ پیش‌از‌جنگ) و مین‌روبی می‌تواند تا شش ماه طول بکشد. کندترین، پرونده‌ی هسته‌ای و تحریم است: غنی‌سازی، ذخیره‌ی حدود ۴۴۰ کیلوگرمی اورانیوم ۶۰٪، رفع تحریم و ۲۴ میلیارد دلار دارایی مسدودِ مورد مناقشه، همه به مذاکرات ۶۰ روزه موکول شدند — و مطالبه‌ی توقف کامل غنی‌سازیِ آمریکا همان سنگی است که دیپلماسیِ بهار مدام به آن می‌خورد.

        پس ریسک زنده دیگر «آیا جنگ اقتصادی به جنگ نظامی تشدید می‌شود» نیست — این رخ داد و سپس متوقف شد. ریسک این است که «آیا چارچوب به تسویه‌ی پایدار تبدیل می‌شود یا عود می‌کند». سخت‌ترین واقعیت جنگ اکنون تثبیت شده: علی خامنه‌ای در ۲۸ فوریه کشته شد و پسرش مجتبی ایران را به‌عنوان رهبری نامرئی و مورد مناقشه اداره می‌کند. پرسش‌های پایین حول فاز تازه بازچینش شده‌اند: چه چیزی قطعی شده، پنجره‌ی ۶۰ روزه چه تصمیمی می‌گیرد، و خروج کجا هنوز می‌تواند بشکند.
      map_to_questions: |
        کارت‌های دیپلماتیک (الف) اکنون می‌سنجند که آیا چارچوب به توافق دائمی سفت می‌شود. کارت‌های نظامی (ب) عمدتاً قطعی شده‌اند — آنچه جنگ انجام داد را ثبت می‌کنند — و B6 دوام آتش‌بس را دنبال می‌کند. کارت‌های اقتصادی (د) حق بیمه‌ی جنگ خود را باز کردند. کارت‌های نظام (ج) یک جانشینی اجباری را ثبت کردند. کارت‌های سمت آمریکا (ه) جایگاه ترامپ را تا انتخابات میان‌دوره‌ای می‌سنجند.

  base_case:
    en:
      full: |
        The war is ending by agreement. On June 14 the US and Iran reached a framework (an MOU Trump called the deal "complete"); Iran's Deputy FM Gharibabadi confirmed it and a formal signing is set for June 19 in Switzerland. The deal halts fighting on all fronts including Lebanon, lifts the US naval blockade, reopens the Strait of Hormuz toll-free, and opens a 60-day window to negotiate a permanent settlement — with enrichment, Iran's ~440kg 60%-enriched stockpile, sanctions relief, and a disputed ~$24B in frozen assets all deferred to those talks. Markets have already priced the off-ramp: Brent fell ~20% off its 2026 peak to ~$84, US gas retraced from a $4.564 May peak to ~$4.07, and the rial strengthened to ~1.62M (it never crossed 2M). Base case for the next 60 days: the signing holds, the ceasefire holds (fragile but intact since the June 11 extension), Hormuz physically reopens on a weeks-to-months mine-clearing timeline rather than instantly, and the nuclear talks grind — with the US zero-enrichment demand the most likely thing to stall a permanent deal. The regime story is settled the hard way: Ali Khamenei was killed Feb 28 and his son Mojtaba leads Iran, unseen in public. On the family-business side: Iranfarhang books keep clearing under the Berman Amendment as the sanctions climate eases; KEMCO SARL payment risk falls but isn't gone until relief is signed and implemented; Kipa's Hormuz-dependent Iran-UAE corridor should reopen on the mine-clearing timeline.
