  # ---- i18n editorial sections ----
  # Two visitor-facing prose sections render above the question board:
  #   1) economic_war_frame — the editorial framing (why the page exists)
  #   2) base_case — the modal forecast (what's most likely)
  # Both have `en` + `fa` variants. `base_case` additionally has a `public`
  # field per language for the stripped public deploy (drops family-business
  # specifics). Renderer falls back to English on missing Persian.

  economic_war_frame:
    en:
      title: "The frame: this is mostly an economic war, with calibrated kinetic shocks"
      body: |
        Neither Tehran nor Washington wants a full shooting war — both have decided it would cost more than either could win. So the slow game is economic. But "slow" doesn't mean "quiet": the May 7–8 naval exchange — IRGC missiles and drones on US destroyers in Hormuz, US strikes on Bandar Abbas and Qeshm Island — showed that both sides will use live fire while simultaneously negotiating a one-page peace memo. The frame is not "no fighting"; it is "fighting kept below the threshold that triggers full war."

        Iran's lever is the Strait of Hormuz. Keep it half-closed, and oil prices stay elevated, Trump pays a domestic political bill in gas-pump prices (now above $4.53 nationally) and midterm polling, and U.S. allies in the Gulf get nervous enough to pressure Washington toward concessions. Iran's new "Persian Gulf Strait Authority" is the institutional expression of that lever — bureaucratizing the blockade to make it easier to partially open for a deal.

        The U.S. lever is the sanctions architecture and naval pressure. Keep both tight, and Iran's rial weakens (now at 1.797M), oil exports grind lower, and Tehran pays the bill in street pressure and currency collapse.

        The biggest change since D68: both sides may be genuinely blinking — a one-page MOU (14-point framework) is being negotiated, "not far but no deal yet." Whoever signs first controls the terms for 30 more days of detailed talks. The risk to the frame is still a miscalculation — the May 7–8 clashes showed how fast a destroyer transit can turn into live fire — but the diplomatic track is now thick enough that even active kinetic exchanges have not derailed it.
      map_to_questions: |
        The diplomatic and economic cards (A and D) measure who's blinking. The kinetic cards (B) measure the risk that one side miscalculates and the frame breaks toward full war. The regime cards (C) measure Iranian internal pressure. The U.S.-side cards (E) measure Trump's political pressure.
    fa:
      title: "چارچوب: این عمدتاً یک جنگ اقتصادی است، با ضربه‌های نظامیِ کالیبره‌شده"
      body: |
        هیچ‌یک از تهران و واشنگتن خواهان جنگ تمام‌عیار نیست — هر دو به این نتیجه رسیده‌اند که هزینه‌اش بیش از دستاوردی است که می‌توانند به‌دست آورند. پس بازی کند، اقتصادی است. اما «کند» به معنای «ساکت» نیست: حملهٔ موشکی ۴ مه ایران به زیرساخت‌های امارات و موشک‌های ضدکشتی سپاه به سمت ناوشکن آمریکایی نشان داد که هر دو طرف وقتی فشار اقتصادی ناخوشایند می‌شود، به ضربه‌های نظامی کالیبره‌شده دست می‌زنند. چارچوب «بدون درگیری» نیست؛ «درگیری زیر آستانه‌ای که جنگ تمام‌عیار را تحریک می‌کند» است.

        اهرم ایران تنگهٔ هرمز است. اگر تنگه نیمه‌بسته بماند، قیمت نفت بالا می‌ماند، ترامپ هزینهٔ سیاسی داخلی را در قالب قیمت بنزین و نظرسنجی‌های انتخابات میان‌دوره‌ای می‌پردازد، و متحدان آمریکا در خلیج فارس به‌اندازه‌ای نگران می‌شوند که واشنگتن را به سمت امتیازدهی فشار دهند.

        اهرم آمریکا ساختار تحریم‌ها و فشار دریایی است. این اهرم اگر سفت بماند، ریال ضعیف‌تر می‌شود، صادرات نفت ایران کاهش می‌یابد، بحران ذخیره‌سازی نفت کاهش تولید را اجباری می‌کند، و تهران هزینه را در قالب فشار خیابانی و فروپاشی ارزی می‌پردازد.

        هر دو طرف در حال حاضر باور دارند می‌توانند بیش از طرف مقابل دوام بیاورند؛ به همین دلیل پیشنهاد چهارده‌بندیِ سوم مه پیشرفتی نکرده است. هرکدام که اول کوتاه بیاید، امتیاز مذاکره را واگذار می‌کند. ریسکِ این چارچوب یک محاسبهٔ غلط است — ضربه‌ای که خط قرمزی را رد کند و طرف مقابل را به تشدیدی فراتر از قصد اولیه وادار سازد.
      map_to_questions: |
