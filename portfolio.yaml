  - id: A6
    category: diplomatic_resolution
    question: Comprehensive/final US-Iran settlement concluded by 2026-09-30
    resolution_criterion: |
      YES on a publicly announced comprehensive/final US-Iran settlement (signed agreement or joint readout) that addresses BOTH nuclear-enrichment limits AND sanctions relief, concluding the 60-day post-framework negotiation, by 2026-09-30.
    deadline: '2026-09-30'
    baseline_class: polymarket_or_broad_reference_class
    reference_class_strict: A1_iran_us_framework_strict
    reference_class_broad: A1_bilateral_nuclear_framework_broad
    expiration_policy: agent_judgment_at_deadline
    stakeholder_tags:
      - us_foreign_policy
      - iran_regime_survival
      - oil_energy_markets
    current_probability: 0.5
    current_credible_interval_80:
      - 0.3
      - 0.7
    current_icd203_label: roughly_even_chance
    last_updated: '2026-06-15'
    notes: |
      The June 14 MOU is a framework, not the permanent settlement: it defers enrichment, Iran's ~440.9kg 60%-enriched stockpile, sanctions relief, and frozen assets ($24B disputed; the US calls it pay-for-performance) to a 60-day window ending ~mid-August. Polymarket prices a permanent peace deal by Aug 31 at ~98% but 'Iran ends enrichment by July 31' at only ~43% — so a comprehensive final settlement by Sep 30 is roughly a coin-flip.
    question_fa: تسویه‌ی جامع/نهایی ایران و آمریکا تا ۳۰ سپتامبر ۲۰۲۶ منعقد شود
    notes_fa: |
      تفاهم‌نامه‌ی ۱۴ ژوئن یک چارچوب است، نه تسویه‌ی دائمی: غنی‌سازی، ذخیره‌ی حدود ۴۴۰.۹ کیلوگرمی اورانیوم ۶۰٪، رفع تحریم و دارایی‌های مسدود (۲۴ میلیارد دلار مورد مناقشه) را به پنجره‌ی ۶۰ روزه‌ی پایان‌یابنده در میانه‌ی اوت موکول می‌کند. پلی‌مارکت صلح دائمی تا ۳۱ اوت را ~۹۸٪ ولی «پایان غنی‌سازی تا ۳۱ ژوئیه» را تنها ~۴۳٪ می‌داند — پس تسویه‌ی جامع تا ۳۰ سپتامبر تقریباً شیر-یا-خط است.
    successors_on_resolve_yes:
      - Does Iran's enrichment stay capped per the settlement through 2026-12-31?
      - Does the US lift the first sanctions tranche by the stated deadline?
