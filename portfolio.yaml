    question_fa: "آمریکا تا ۳۱ دسامبر ۲۰۲۶ به‌طور رسمی نفت‌کش‌های با پرچم شورای همکاری خلیج فارس را که از هرمز عبور می‌کنند تحت پرچم خود می‌برد"
