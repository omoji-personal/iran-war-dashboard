    current_credible_interval_80: [1.0, 1.0]
    current_icd203_label: very_likely
    last_updated: 2026-05-09T07:00:00-04:00
    notes: |
      **RESOLVED YES — 2026-05-07 (D69)**
      CENTCOM confirmed US strikes on Iranian military facilities at Bandar Abbas and
      Qeshm Island on May 7 in response to Iranian missile/drone/small-boat attacks on
      US destroyers transiting Hormuz. Attributed by US gov (CENTCOM public statement) +
      confirmed by CNN, NBC, NPR, Business Standard (≥2 Tier-1 sources). Trump described
      as "defensive self-defense" not resumption of major combat, but resolution criterion
      does not require "major combat" — only kinetic strike on Iranian sovereign territory
      with US gov attribution. Resolution criterion met.
    question_fa: "آمریکا تا ۳۱ دسامبر ۲۰۲۶ ضربهٔ نظامی به خاک حاکمیتی ایران می‌زند"
