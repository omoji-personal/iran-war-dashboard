# Iran-US Conflict Predictive Agent — Question Portfolio v0.1.0
# Schema: see docs/superpowers/specs/2026-05-03-predictive-agent-design.md §10
#
# Each question carries: id, category, question text, resolution_criterion, deadline,
# baseline_class, reference_class refs, expiration_policy, stakeholder_tags,
# successors_on_resolve_yes/no, current state (probability, CI, ICD-203, last_updated).
#
# Probabilities are MANUAL initial reads (operator first-pass) for Phase 0 MVP.
# Phase 2+ will replace with ensemble outputs (Bayesian + baseline + market + expert).

questions:
  # ===== A. Diplomatic resolution =====
  - id: A1
    category: diplomatic_resolution
    question: "Iran-US framework agreement signed (any form) by 2026-09-30"
    resolution_criterion: |
      YES on joint readout from State Dept + Iranian FM + at least one mediator
      (Pakistan/Oman/Qatar) confirming a written framework with sanctions-relief
      OR nuclear-monitoring components.
    deadline: 2026-09-30
    baseline_class: polymarket_or_broad_reference_class
    reference_class_strict: A1_iran_us_framework_strict
    reference_class_broad: A1_bilateral_nuclear_framework_broad
    expiration_policy: agent_judgment_at_deadline
    stakeholder_tags: [us_foreign_policy, iran_regime_survival, oil_energy_markets]
    current_probability: 0.45
    current_credible_interval_80: [0.28, 0.62]
    current_icd203_label: roughly_even_chance
    last_updated: 2026-05-10T07:00:00-04:00
    notes: |
      Axios May 6 exclusive: US-Iran closing in on 14-point MOU to end war; US expects
      Iranian response within 48h. Enrichment moratorium: 12-15yr under discussion (US wanted
      20, Iran proposed 5). Polymarket deal-by-Dec 2026 = 78%. Trump-Xi summit May 14-15 is
      the next inflection — Iran central to Beijing agenda. Raised from 22% to 45%.
    question_fa: "توافق چارچوبی ایران و آمریکا (به هر شکل) تا ۳۰ سپتامبر ۲۰۲۶ امضا شود"
    notes_fa: |
      اکسیوس ۶ مه: آمریکا و ایران در حال نزدیک‌شدن به یادداشت تفاهم ۱۴بندی برای پایان جنگ؛
      آمریکا ظرف ۴۸ ساعت پاسخ ایران را انتظار دارد. مهلت توقف غنی‌سازی: ۱۲تا۱۵ سال (آمریکا ۲۰
      خواست، ایران ۵ پیشنهاد داد). Polymarket توافق تا دسامبر ۲۰۲۶ = ۷۸٪. نشست ترامپ-شی
      ۱۴تا۱۵ مه محور تعیین‌کننده — ایران موضوع اصلی پکن. از ۲۲٪ به ۴۵٪ افزایش یافت.
    successors_on_resolve_yes:
      - "Iran enriches above 60% within 90d of signing?"
      - "US lifts first sanctions tranche by stated deadline?"
      - "Israel publicly disowns deal within 30d?"
      - "IAEA reports first compliance discrepancy within 180d?"
    successors_on_resolve_no_or_expire:
      - "Iran proposes second framework within 90d of A1 expiration?"
      - "US escalates pressure (new sanctions tranche / strike) within 30d?"

