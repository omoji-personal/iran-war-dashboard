    fa:
      full: |
        جنگ با توافق پایان می‌یابد. در ۱۴ ژوئن آمریکا و ایران به یک چارچوب رسیدند (تفاهم‌نامه‌ای که ترامپ آن را «کامل» خواند)؛ قریب‌آبادی معاون وزیر خارجه‌ی ایران تأیید کرد و امضای رسمی برای ۱۹ ژوئن در سوئیس تعیین شد. توافق جنگ را در همه‌ی جبهه‌ها از جمله لبنان متوقف می‌کند، محاصره‌ی دریایی آمریکا را برمی‌دارد، هرمز را بدون عوارض بازمی‌گشاید، و پنجره‌ی ۶۰ روزه‌ای برای مذاکره‌ی تسویه‌ی دائمی می‌گشاید — با موکول‌شدن غنی‌سازی، ذخیره‌ی حدود ۴۴۰ کیلوگرمی اورانیوم ۶۰٪، رفع تحریم و حدود ۲۴ میلیارد دلار دارایی مسدودِ مورد مناقشه به آن مذاکرات. بازارها خروج را قیمت‌گذاری کرده‌اند: برنت حدود ۲۰٪ از سقف ۲۰۲۶ افت کرد به حدود ۸۴ دلار، بنزین آمریکا از سقف ۴.۵۶۴ دلاری مه به حدود ۴.۰۷ دلار بازگشت، و ریال به حدود ۱.۶۲ میلیون تقویت شد (هرگز از ۲ میلیون عبور نکرد). خط پایه برای ۶۰ روز آینده: امضا برقرار می‌ماند، آتش‌بس (شکننده ولی پابرجا از تمدید ۱۱ ژوئن) دوام می‌آورد، هرمز به‌جای آنی در بازه‌ی هفته‌تا‌ماهِ مین‌روبی فیزیکی بازمی‌شود، و مذاکرات هسته‌ای کند پیش می‌رود — با مطالبه‌ی توقف غنی‌سازیِ آمریکا محتمل‌ترین مانعِ توافق دائمی. داستان نظام به سخت‌ترین شکل تثبیت شده: علی خامنه‌ای در ۲۸ فوریه کشته شد و پسرش مجتبی ایران را رهبری می‌کند، نادیده در ملأ عام. در سمت کسب‌وکار خانوادگی: کتاب‌های ایران‌فرهنگ ذیل متمم برمن همچنان ترخیص می‌شوند؛ ریسک پرداخت Kemco SARL کاهش می‌یابد ولی تا امضا و اجرای تسهیل از بین نمی‌رود؛ کریدور ایران-اماراتِ کیپا وابسته به هرمز باید در بازه‌ی مین‌روبی بازگشایی شود.
