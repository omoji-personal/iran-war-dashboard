        روز ۷۲ (۱۰ مه): مسیر آرامش پابرجاست و افق دیپلماتیک تغییر کرده. اکسیوس (۶ مه) گزارش داد آمریکا و ایران در حال نزدیک‌شدن به یادداشت تفاهم ۱۴بندی یک‌صفحه‌ای هستند که پایان جنگ را اعلام کرده و یک پنجرهٔ ۳۰روزه برای مذاکرات تفصیلی درباره هسته و هرمز باز می‌کند. مهلت توقف غنی‌سازی در حال مذاکره در محدودهٔ ۱۲ تا ۱۵ سال است. نشست ترامپ-شی در ۱۴ تا ۱۵ مه (چهار روز دیگر) نقطهٔ بعدی است: ایران در کانون دستور کار پکن است و چین تهران را به سمت دیپلماسی فشار می‌آورد. برنت از ۱۱۱.۸۰ دلار (روز ۶۸) به حدود ۱۰۱ دلار (روز ۷۲) در نتیجهٔ خوش‌بینی توافق کاهش یافته. ریال به ۱.۸۰ میلیون رسیده — پایدار اما همچنان بالاتر از سطح پیش‌از‌جنگ. ایران کاهش تولید نفت حدود ۴۰۰ هزار بشکه در روز را در نتیجهٔ بحران ذخیره‌سازی تأیید کرد. آتش‌بس اسرائیل-لبنان از ۱۶ آوریل حدود ۲۴ روز پایدار مانده.

        خط پایه برای ۳۰ روز آینده: یادداشت تفاهم در دو هفته اطراف نشست پکن امضا می‌شود. پنجرهٔ مذاکراتی ۳۰روزه رسمی باز می‌شود. ترافیک هرمز به سمت ۲۰ تا ۳۰٪ از پیش‌از‌جنگ شروع به بهبود می‌کند. برنت به سمت ۹۰ تا ۱۰۰ دلار حرکت می‌کند اگر یادداشت تفاهم امضا شود؛ اگر مذاکرات شکست بخورد به بالای ۱۱۰ دلار برمی‌گردد.
