# Iran-US Conflict Predictive Agent — Question Portfolio v0.1.0
# Schema: see docs/superpowers/specs/2026-05-03-predictive-agent-design.md §10
#
# Each question carries: id, category, question text, resolution_criterion, deadline,
# baseline_class, reference_class refs, expiration_policy, stakeholder_tags,
# successors_on_resolve_yes/no, current state (probability, CI, ICD-203, last_updated).
#
# Probabilities are MANUAL initial reads (operator first-pass) for Phase 0 MVP.
# Phase 2+ will replace with ensemble outputs (Bayesian + baseline + market + expert).

questions:
  # ===== A. Diplomatic resolution =====
  - id: A1
    category: diplomatic_resolution
    question: "Iran-US framework agreement signed (any form) by 2026-09-30"
    resolution_criterion: |
      YES on joint readout from State Dept + Iranian FM + at least one mediator
      (Pakistan/Oman/Qatar) confirming a written framework with sanctions-relief
      OR nuclear-monitoring components.
    deadline: 2026-09-30
    baseline_class: polymarket_or_broad_reference_class
    reference_class_strict: A1_iran_us_framework_strict
    reference_class_broad: A1_bilateral_nuclear_framework_broad
    expiration_policy: agent_judgment_at_deadline
    stakeholder_tags: [us_foreign_policy, iran_regime_survival, oil_energy_markets]
    current_probability: 0.93
    current_credible_interval_80:
      - 0.85
      - 0.98
    current_icd203_label: very_likely
    last_updated: '2026-06-15'
    notes: |
      Framework MOU reached June 14 (Trump declared the deal 'complete'); Iran's Deputy FM Gharibabadi confirmed it, with formal signing set for June 19 in Switzerland. Held just short of resolved-YES pending signature — prior 'complete' announcements had collapsed, and the written framework defers the sanctions-relief and nuclear-monitoring components to 60-day follow-on talks (NBC/Axios/Al Jazeera).
    question_fa: "توافق چارچوبی ایران و آمریکا (به هر شکل) تا ۳۰ سپتامبر ۲۰۲۶ امضا شود"
    notes_fa: |
      توافق چارچوبی (تفاهم‌نامه) در ۱۴ ژوئن حاصل شد و ترامپ آن را «کامل» خواند؛ قریب‌آبادی معاون وزیر خارجه‌ی ایران تأیید کرد و امضای رسمی برای ۱۹ ژوئن در سوئیس تعیین شد. کمی پیش از قطعی‌شدنِ بله نگه داشته شد چون اجزای رفع تحریم و نظارت هسته‌ای به مذاکرات ۶۰ روزه موکول شده‌اند.
    successors_on_resolve_yes:
      - "Iran enriches above 60% within 90d of signing?"
      - "US lifts first sanctions tranche by stated deadline?"
      - "Israel publicly disowns deal within 30d?"
      - "IAEA reports first compliance discrepancy within 180d?"
    successors_on_resolve_no_or_expire:
      - "Iran proposes second framework within 90d of A1 expiration?"
      - "US escalates pressure (new sanctions tranche / strike) within 30d?"

  - id: A2
    category: diplomatic_resolution
    question: "Hormuz commercial transit returns to >50% pre-war (>67 vessels/day, 7d MA) by 2026-12-31"
    resolution_criterion: |
      MarineTraffic/Spire AIS 7-day moving average of commercial transit through
      Hormuz exceeds 67 vessels/day at any point between now and 2026-12-31.
    deadline: 2026-12-31
    baseline_class: ar
    reference_class_strict: A2_hormuz_normalization_strict
    reference_class_broad: A2_blockade_resolution_broad
    expiration_policy: auto_resolve_no
    stakeholder_tags: [oil_energy_markets, regional_security]
    current_probability: 0.8
    current_credible_interval_80:
      - 0.62
      - 0.93
    current_icd203_label: very_likely
    last_updated: '2026-06-15'
    notes: |
      Trump ordered the naval blockade lifted and Hormuz reopened toll-free (June 14); commercial transit was still only ~2-6 vessels/day pre-deal vs ~135 pre-war, and physical recovery is gated by mine-clearing (Polymarket prices year-end normalization ~88%). >50% pre-war (>67/day 7d-MA) by Dec 31 is now likely, not certain (CNBC/USNI).
    question_fa: "ترانزیت تجاری تنگهٔ هرمز تا ۳۱ دسامبر ۲۰۲۶ به بیش از ۵۰٪ سطح پیش‌از‌جنگ بازگردد (بیش از ۶۷ کشتی در روز، میانگین ۷ روزه)"
    notes_fa: |
      ترامپ در ۱۴ ژوئن دستور رفع محاصره‌ی دریایی و بازگشایی بدون‌عوارض هرمز را داد؛ تردد تجاری پیش از توافق هنوز حدود ۲ تا ۶ کشتی در روز بود (در برابر ۱۳۵ پیش‌از‌جنگ) و بازیابی فیزیکی به مین‌روبی بستگی دارد. عبور از ۵۰٪ سطح پیش‌از‌جنگ تا پایان سال محتمل ولی نه قطعی.
    successors_on_resolve_yes:
      - "Hormuz transit returns to >90% pre-war by 2027-03-31?"
      - "Iran formally rescinds Hormuz Sovereignty Law within 60d?"
    successors_on_resolve_no_or_expire:
      - "Hormuz transit remains <30% pre-war through 2027-Q1?"

