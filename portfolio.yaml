      خوش‌بینی به توافق را علامت می‌دهد. طرح حمله سنتکام هنوز در پرونده ولی سیاسی منجمد.
    successors_on_resolve_yes:
      - "Iran retaliates within 14d?"
      - "Hormuz closure attempt within 7d?"
      - "Brent +$30 within 14d?"
      - "Trump approval rating drops >5pp within 30d?"
    successors_on_resolve_no:
