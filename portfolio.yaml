      full: |
        D71 (May 9): The diplomatic track and the kinetic track ran simultaneously this week — and both escalated. On May 7–8, IRGC launched missiles, drones, and small boats against US destroyers transiting Hormuz; the US struck back at Bandar Abbas and Qeshm Island; Iran seized a third commercial vessel (Ocean Koi); and US forces disabled two tankers heading for Iranian ports. Trump called the US strikes "defensive" and said "the ceasefire still holds." At the same time, Witkoff and Kushner are reportedly within reach of a one-page MOU with Iranian officials — a 14-point framework that would declare an end to the war, open a 30-day negotiation window on nuclear limits and Hormuz reopening, and lift sanctions. "Not far, but no deal yet" (US official). Iran is still reviewing and "strongly rejected" some terms. Trump-Xi summit on May 14–15 is the next inflection.

        The frame is evolving: this is still an economic war with calibrated kinetic shocks, but the "calibrated" part is increasingly tested. Brent is at $101–104 (down from $115 D66 and $111.80 D68) — the war premium is compressing as deal optimism rises. AAA gas crossed $4.53/gallon — the political pain threshold Trump is watching. Rial at 1.797M (slightly up from D68's 1.76M).

        Base-case for next 14 days: MOU talks continue through the Trump-Xi summit May 14–15; if Xi presses Iran and Trump holds the diplomatic track, a signed one-pager is possible by May 20–25. Hormuz reopening would follow in the 30-day negotiation window. Iranfarhang books keep clearing through the Berman Amendment exemption; Kipa's AMAG-Dubai corridor remains functional but the new "Persian Gulf Strait Authority" adds a compliance layer. The questions below are the named ways this base case could break — toward full Hormuz closure and a wider war, or toward an actual signed framework and sanctions relief.
