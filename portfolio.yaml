    question_fa: "خامنه‌ای تا ۳۱ دسامبر ۲۰۲۶ به‌طور علنی از مذاکره با چارچوب «نرمش قهرمانانه» حمایت کند"
    notes_fa: |
      نذر هسته‌ای ۳۰ آوریل خامنه‌ای در جهت مخالف اشاره می‌کند. سابقهٔ ۱۹۸۹ + ۲۰۱۳.
      گزارش‌ها از بهبودی او از سوختگی شدید حکایت دارند؛ ظاهر علنی کم.

