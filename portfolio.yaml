# Iran-US Conflict Predictive Agent — Question Portfolio v0.1.0
# Schema: see docs/superpowers/specs/2026-05-03-predictive-agent-design.md §10
#
# Each question carries: id, category, question text, resolution_criterion, deadline,
# baseline_class, reference_class refs, expiration_policy, stakeholder_tags,
# successors_on_resolve_yes/no, current state (probability, CI, ICD-203, last_updated).
