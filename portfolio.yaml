    resolution_criterion: |
      US military strike (manned aircraft, missile, drone) impacting target
      inside internationally-recognized Iranian territory, attributed by US gov
      OR independently confirmed by ≥2 Tier-1 outlets.
    deadline: 2026-12-31
    baseline_class: polymarket_or_broad_reference_class
    reference_class_strict: B1_us_strike_iran_strict
    reference_class_broad: B1_us_strike_named_state_broad
