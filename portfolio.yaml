  # ---- i18n editorial sections ----
  # Two visitor-facing prose sections render above the question board:
  #   1) economic_war_frame — the editorial framing (why the page exists)
  #   2) base_case — the modal forecast (what's most likely)
  # Both have `en` + `fa` variants. `base_case` additionally has a `public`
  # field per language for the stripped public deploy (drops family-business
  # specifics). Renderer falls back to English on missing Persian.

  economic_war_frame:
    en:
      title: "The frame: this is mostly an economic war, with calibrated kinetic shocks"
      body: |
        Neither Tehran nor Washington wants a full shooting war — both have decided it would cost more than either could win. So the slow game is economic. But "slow" doesn't mean "quiet": Iran's May 4 missile barrage on UAE infrastructure and the IRGC's anti-ship missiles at a U.S. destroyer showed that both sides will throw calibrated kinetic strikes when the economic squeeze gets uncomfortable. The frame is not "no fighting"; it is "fighting kept below the threshold that triggers full war."

        Iran's lever is the Strait of Hormuz. Keep it half-closed, and oil prices stay elevated, Trump pays a domestic political bill in gas-pump prices and midterm polling, and U.S. allies in the Gulf get nervous enough to pressure Washington toward concessions.

        The U.S. lever is the sanctions architecture and naval pressure. Keep both tight, and Iran's rial weakens, oil exports grind lower, the storage crisis forces production cuts, and Tehran pays the bill in street pressure and currency collapse.

        Both sides currently believe they can outlast the other's economic pain, which is why the May 3 fourteen-point counter-proposal hasn't moved. Whoever blinks first concedes the negotiating points. The risk to the frame is a miscalculation — a strike that crosses a line and forces the other side to escalate beyond what either intended.
      map_to_questions: |
        The diplomatic and economic cards (A and D) measure who's blinking. The kinetic cards (B) measure the risk that one side miscalculates and the frame breaks toward full war. The regime cards (C) measure Iranian internal pressure. The U.S.-side cards (E) measure Trump's political pressure.
    fa:
      title: "چارچوب: این عمدتاً یک جنگ اقتصادی است، با ضربه‌های نظامیِ کالیبره‌شده"
      body: |
        هیچ‌یک از تهران و واشنگتن خواهان جنگ تمام‌عیار نیست — هر دو به این نتیجه رسیده‌اند که هزینه‌اش بیش از دستاوردی است که می‌توانند به‌دست آورند. پس بازی کند، اقتصادی است. اما «کند» به معنای «ساکت» نیست: حملهٔ موشکی ۴ مه ایران به زیرساخت‌های امارات و موشک‌های ضدکشتی سپاه به سمت ناوشکن آمریکایی نشان داد که هر دو طرف وقتی فشار اقتصادی ناخوشایند می‌شود، به ضربه‌های نظامی کالیبره‌شده دست می‌زنند. چارچوب «بدون درگیری» نیست؛ «درگیری زیر آستانه‌ای که جنگ تمام‌عیار را تحریک می‌کند» است.

        اهرم ایران تنگهٔ هرمز است. اگر تنگه نیمه‌بسته بماند، قیمت نفت بالا می‌ماند، ترامپ هزینهٔ سیاسی داخلی را در قالب قیمت بنزین و نظرسنجی‌های انتخابات میان‌دوره‌ای می‌پردازد، و متحدان آمریکا در خلیج فارس به‌اندازه‌ای نگران می‌شوند که واشنگتن را به سمت امتیازدهی فشار دهند.

        اهرم آمریکا ساختار تحریم‌ها و فشار دریایی است. این اهرم اگر سفت بماند، ریال ضعیف‌تر می‌شود، صادرات نفت ایران کاهش می‌یابد، بحران ذخیره‌سازی نفت کاهش تولید را اجباری می‌کند، و تهران هزینه را در قالب فشار خیابانی و فروپاشی ارزی می‌پردازد.

        هر دو طرف در حال حاضر باور دارند می‌توانند بیش از طرف مقابل دوام بیاورند؛ به همین دلیل پیشنهاد چهارده‌بندیِ سوم مه پیشرفتی نکرده است. هرکدام که اول کوتاه بیاید، امتیاز مذاکره را واگذار می‌کند. ریسکِ این چارچوب یک محاسبهٔ غلط است — ضربه‌ای که خط قرمزی را رد کند و طرف مقابل را به تشدیدی فراتر از قصد اولیه وادار سازد.
      map_to_questions: |
        پرسش‌های دیپلماتیک و اقتصادی (A و D) نشان می‌دهند چه کسی در حال کوتاه‌آمدن است. پرسش‌های نظامی (B) ریسک شکستن چارچوب به سمت جنگ تمام‌عیار را اندازه می‌گیرند. پرسش‌های مربوط به نظام/رهبری (C) فشار داخلی ایران را می‌سنجند. پرسش‌های مربوط به آمریکا (E) فشار سیاسی بر ترامپ را اندازه می‌گیرند.

  base_case:
    en:
      full: |
        D72 (May 10): The de-escalation track is holding and the diplomatic horizon has shifted. Axios (May 6) reported the US and Iran are closing in on a 14-point, one-page MOU that would declare an end to the war and open a 30-day window for detailed nuclear and Hormuz negotiations. The enrichment moratorium is being negotiated at 12–15 years. The Trump-Xi summit on May 14–15 (four days away) is the next inflection: Iran is central to the Beijing agenda, and China has been pressing Tehran toward diplomacy. Brent has dropped from $111.80 (D68) to ~$101 (D72) on deal optimism. The rial is 1.80 million — stable but still well above pre-war levels. Iran confirmed it has cut oil production by ~400K bpd as blockade forces storage crisis. The Israel-Lebanon ceasefire has held for ~24 days since April 16.

        Base case for the next 30 days: The MOU gets signed in the two weeks around the Beijing summit. A formal 30-day negotiation period opens. Hormuz traffic begins a slow recovery toward 20–30% of pre-war, but full reopening requires the detailed deal (a further 60–90 days). Brent drifts toward $90–100 if MOU is signed; snaps back above $110 if talks collapse. The key failure mode is the uranium-enrichment-duration gap (US wants 20yr, Iran proposed 5, current negotiation at 12–15yr). Iranfarhang books keep clearing through the Berman Amendment exemption; Kipa's Hormuz access remains restricted but polymer war premiums begin compressing. The questions below are the named ways this base case could break — toward a wider regional war, or toward an actual signed framework.
