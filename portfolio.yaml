        روز ۷۱ (۹ مه): این هفته مسیر دیپلماتیک و مسیر نظامی هم‌زمان پیش رفتند — و هر دو تشدید شدند. در ۷–۸ مه، سپاه موشک، پهپاد و قایق‌های تندرو به ناوشکن‌های آمریکایی در گذرگاه هرمز حمله کرد؛ آمریکا بندرعباس و جزیرهٔ قشم را هدف قرار داد؛ ایران سومین کشتی تجاری (Ocean Koi) را توقیف کرد؛ و نیروهای آمریکایی دو نفت‌کش متوجه بنادر ایرانی را ناتوان ساختند. ترامپ ضربات آمریکایی را «دفاعی» خواند و گفت «آتش‌بس برقرار است.» هم‌زمان، ویتکاف و کوشنر به گفتهٔ منابع در آستانهٔ یادداشت تفاهم یک‌صفحه‌ای با مقامات ایرانی هستند — چارچوب ۱۴‌بندی که پایان جنگ، ۳۰ روز مذاکره دربارهٔ هسته‌ای و هرمز، و تسهیل تحریم‌ها را در بر می‌گیرد. «نزدیک هستیم ولی هنوز توافقی نشده.» ایران هنوز در حال بررسی است. نشست ترامپ-شی در ۱۴–۱۵ مه نقطهٔ بعدی است. برنت در ۱۰۱–۱۰۴ دلار، ریال ۱٫۷۹۷ میلیون، بنزین آمریکا ۴٫۵۳ دلار.
