[project]
name = "iran-war-dashboard"
version = "0.2.0"
description = "Iran-US Conflict Predictive Agent — Brier-scoreable discrete-event prediction portfolio + daily Claude-cron tick"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
norecursedirs = ["legacy", "legacy/*"]
