[project]
name = "iran-war-dashboard-engine"
version = "0.1.0"
description = "Engine that emits war-data.json from signals.yaml"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
