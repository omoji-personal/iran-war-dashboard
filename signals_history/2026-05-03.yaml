    capability: No offensive action by either side; 26-day zero-attack streak holds.
      Iran submitted a 14-point counter-proposal via Pakistani mediators — most structured
      diplomatic response since talks began. Mojtaba Khamenei (Persian Gulf Day statement)
      publicly vowed to protect nuclear and missile capabilities as national assets
      and declared Americans belong at the bottom of the Gulf, setting a hard floor
      on nuclear concessions.
    cost: Brent ~$108.20 (day range $103.60–$108.65, -$0.30 from D64); WTI ~$101.90;
      Brent-WTI spread narrows to $6.30 as ceasefire-deal optimism offset by Khamenei
      hardline. AAA gas $4.446 (+$0.013). Polymarket deal-by-Jun30 fell to 36% (-3pp).
      Iran parliament Hormuz sovereignty law formalizes toll regime and hostile-nation
      transit ban; US Treasury warned shippers against paying Iran Hormuz tolls.
    assessment: 'Iran''s 14-point counter-proposal represents the most structured
      diplomatic engagement since Islamabad — a constructive signal that Tehran is
      still negotiating rather than only posturing. Trump reviewing the concept of
      deal (vs D64 flat rejection) is a marginal positive. But Khamenei''s nuclear/missile
      vow is a public commitment that forecloses the zero-enrichment demand at the
      core of the US position; combined with the parliament Hormuz law formalizing
      the blockade as sovereign policy, the structural gap is unchanged. Deal probability
      edged down to ~0.36 (Polymarket-aligned); escalation risk ticks up to ~0.46
      as IRGC-aligned Khamenei sets explicit nuclear red line. Pivot point: whether
      Trump can accept a deal that acknowledges Iranian enrichment rights rather than
      demanding zero.'
