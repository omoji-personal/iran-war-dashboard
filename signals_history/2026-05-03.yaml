meta:
  day: 65
  cf_day: 26
  date: '2026-05-03'
  notes:
  - 'D65 (May 03, cfDay26): IRAN SUBMITS 14-POINT COUNTER-PROPOSAL; TRUMP REVIEWS
    ''CONCEPT OF DEAL''; KHAMENEI NUCLEAR VOW HARDENS RED LINES. (1) NEW PROPOSAL:
    Iran transmitted a 14-point counter-proposal to US via Pakistani mediators; Trump
    was briefed on the ''concept of the deal'' and awaiting ''exact wording'' — a
    notable shift from D64 flat rejection, though still ''not satisfied'' as of Friday.
    Araghchi expressed uncertainty about imminence; Khamenei advisor Shamkhani called
    US nuclear control demands a ''fantasy.'' Polymarket deal-by-Jun30 fell to 36%
    (-3pp) on Khamenei nuclear hardline. (2) MOJTABA KHAMENEI (Persian Gulf Day statement):
    vowed to protect nuclear and missile capabilities as national assets; declared
    Americans belong ''at the bottom of'' the Gulf''s waters. Khamenei reportedly
    recovering from severe burns, awaiting prosthetic leg, publicly unseen since Feb
    28. (3) HORMUZ SOVEREIGNTY LAW: Iran parliament advancing 12-article law formalizing
    Hormuz toll regime — friendly vessels pay, hostile nations banned; first toll
    revenues reportedly deposited at Central Bank; US Treasury warned shippers against
    paying tolls. (4) OIL: Brent ~$108.20 (day range $103.60–$108.65); WTI ~$101.90;
    Brent-WTI spread $6.30; AAA gas $4.446 (+$0.013). Lebanon killed corrected upward
    to 2,659+ (2,618 by May 1 per Wikipedia + 41 more May 2 per AJ). Zero-attack streak
    Day 26; Internet Day 66 = 1,584+ hrs; ~2,000 ships stranded. Convergence 4.6.'
