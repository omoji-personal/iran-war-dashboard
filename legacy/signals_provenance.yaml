# R13: Provenance ledger for the numeric inputs in signals.yaml
#
# For every field in signals.yaml that is not directly observable (i.e., not a
# news-reported scalar like brent or us_kia), record:
#   - source: where the number came from (URL, dataset, polling, "subjective")
#   - last_verified: ISO date when the source was last checked
#   - notes: methodology, scoring rubric, any inter-rater divergence
#
# Engine reads this file to surface "unsourced inputs" warnings on the dashboard.
# Goal: every numeric input either has a citation or is explicitly tagged
# "subjective — analyst estimate, not validated."
#
# Schema (pydantic class to enforce TBD):
#   field_path:
#     source: str
#     last_verified: YYYY-MM-DD | null
#     notes: str
#
# Initial seed: most fields tagged "subjective — analyst estimate" until the
# scoring rubric work in R13/R10 is completed.

stakeholders.trump.ego_size:
  source: subjective — analyst estimate (consensus reading of media coverage)
  last_verified: 2026-05-03
  notes: |
    Derived from public-statement frequency, language of self-reference, and
    historical pattern across 2017-26. No formal psychometric scoring.
stakeholders.trump.public_commitment:
  source: subjective — analyst estimate
  last_verified: 2026-05-03
