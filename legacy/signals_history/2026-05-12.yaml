    capability: 'Iran attacked 3 US destroyers on D69 (May 7) — US intercepted, no damage, struck Qeshm facilities in retaliation. US disabled 2 Iranian oil tankers D70 (May 8). Hezbollah claimed 26 attacks D73 including 2 strikes inside Israel — first cross-border attack since mid-April truce. No new offensive strikes today (D74) but IRGC threat level elevated: warned ''heavy assault on US bases'' if tanker attacks continue. 4th Oman round ran 3+ hours May 11: ''difficult but constructive'' — diplomacy alive.'
    cost: 'Brent $104.97 (+0.73%); WTI ~$98.50; Brent-WTI spread $6.47. AAA gas $4.520 — ABOVE $4.50 political threshold (5th consecutive day). Rial 1,842,000 (alanchand) — D68 recovery reversed; 158K from 2M threshold. Internet blackout Day 74 = 1,776+ hrs. Lebanon killed ~2,905+. US casualties est. KIA 17, wounded 555. Hormuz zero commercial transits since D66 (8 days). Houthi attacks Red Sea 7d: 3.'
    assessment: 'The diplomatic frame has inverted from D68 optimism to D74 crisis-mode. Trump''s "garbage" rejection and "life support" language are the most confrontational presidential statements since the ceasefire began. Iran''s phased proposal (peace first, nuclear later) is structurally incompatible with the US one-page MOU demand (nuclear moratorium upfront). But Oman Round 4 ran 3+ hours — neither side has walked away. The Trump-Xi summit on May 14-15 is the last live circuit-breaker before this ceasefire formally collapses: if Xi commits to cutting Iran oil revenue as a lever, that changes Iran''s calculation. If the summit produces nothing, escalation risk spikes materially. Key watch: IRGC seizure threat vs US tanker interdiction — the next 48-72 hours before the summit are high-risk for a miscalculation. D3 (gas >$4.50 7-day) is on the verge of YES-resolution. B2 (Iran attacks US forces) is near-resolution YES from D69.'
