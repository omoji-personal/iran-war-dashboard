  notes:
  - 'D74 (May 12, cfDay35): CEASEFIRE ON LIFE SUPPORT — TRUMP REJECTS IRAN PROPOSAL
    AS ''GARBAGE''; HORMUZ CLOSED 8 DAYS; OMAN ROUND 4 ''DIFFICULT BUT CONSTRUCTIVE''.
    (1) DIPLOMACY COLLAPSE: On D72 (May 10) Iran submitted phased counter-proposal
    (peace+sanctions first, nuclear deferred) via Pakistan. Trump posted ''TOTALLY
    UNACCEPTABLE'' and called ceasefire ''on life support'' D73 (May 11). Iran vowed
    ''never bow'' on nuclear. BUT: 4th round of Oman talks held D73 for 3+ hours —
    both sides called it ''difficult but constructive'' — contact not severed.
    Trump-Xi summit May 14-15 is the live inflection point (US to press Xi on cutting
    Iran oil revenue). (2) HORMUZ KINETICS: D69 (May 7): Iran attacked 3 US destroyers
    transiting Hormuz; US intercepted with no damage, struck Iranian military facilities
    on Qeshm Island. D70 (May 8): US fired on and disabled 2 Iranian oil tankers; UAE
    hit by 2 ballistic missiles+3 drones (3 wounded). IRGC warned ''heavy assault on
    US bases'' if tanker attacks continue. Zero commercial transits since D66. (3) LEBANON:
    Hezbollah claimed 26 attacks D73 including 2 inside Israel — first cross-border
    since mid-April. IDF killed 39 in Lebanon on May 9, 40+ on May 10. Total Lebanon
    killed ~2,900+. (4) OIL/ECON: Brent $104.97 (+0.73% D74); WTI ~$98.50; AAA gas
    $4.520 national average — ABOVE $4.50 threshold for ~5 days (D3 near-resolution).
    Rial 1,842,000 (alanchand, May 12) — D68 relief reversed; ~158K from 2M threshold.
    Internet blackout Day 74 = 1,776+ hrs. (5) US CASUALTIES (est.): KIA ~17, wounded
    ~555, aircraft lost 7. Lebanon ~2,900+, Iran civ (HRANA) ~3,750.'
