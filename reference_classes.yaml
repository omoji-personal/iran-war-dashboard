# Iran-US Conflict Predictive Agent — Reference-Class Registry v0.1.0
#
# Two-tier reference classes:
#   - strict: small-N, narrative anchor, NOT used for probability
#   - broad: analogous bilateral cases, USED for actual base-rate calc
#
# Schema per class:
#   id:
#     inclusion_criteria: prose
#     members: [{name, date, status, notes}]
#     n: count
#     base_rate_30d / 90d / etc: empirical fractions
#     last_audited: ISO date
#     next_audit: ISO date

# ===== A. Diplomatic resolution =====
A1_iran_us_framework_strict:
  inclusion_criteria: |
    Iran-US bilateral nuclear-framework agreement (any form) with FM-level or higher
    written commitment from both sides involving sanctions-relief tranche OR
    nuclear-monitoring step-up.
  members:
    - {name: "JCPOA 2015", date: "2015-07-14", status: signed, notes: "Comprehensive"}
    - {name: "Joint Plan of Action 2013", date: "2013-11-24", status: signed, notes: "Interim"}
    - {name: "Agreed Framework collapse 2003-05", date: "2005-08", status: collapsed, notes: "Tehran negotiations collapsed under Ahmadinejad"}
    - {name: "Tehran Declaration 2010", date: "2010-05-17", status: marginal, notes: "Brazil/Turkey-mediated; rejected by US/UN"}
  n: 4
  base_rate_30d_acceptance_after_proposal: 0.50
  note: "n too small for probability; used only as narrative anchor. See A1_bilateral_nuclear_framework_broad."
  last_audited: 2026-05-03
  next_audit: 2026-08-03

